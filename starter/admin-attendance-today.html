<!doctype html>
<!-- Blue Roster · Admin · Attendance Today (mobile 390).
     COMPOSED PATTERN — PENDING DESIGN APPROVAL. No Figma frame exists yet.
     Composed from my-schedule-day (date nav, legend, hour rows, event blocks), br-m-avatar and br-m-status-pill.
     Placeholder names only ("Employee 1..6"); shift titles/times from fixtures/schedule.json. Add ?theme=dark for Dark. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Attendance Today — Blue Roster (composed)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
<link rel="stylesheet" href="br-m.css">
<script>if (/theme=dark/.test(location.search)) document.documentElement.setAttribute('data-theme','dark');</script>
<style>html,body{margin:0;background:var(--br-contrast);}
/* Composed: only br-m.css pieces + tokens. */
.att-note{font:400 11px/14px "Roboto",sans-serif;color:var(--br-text-label);border:1px dashed var(--br-component-border);border-radius:var(--radius-lg);padding:6px 8px}
.att-summary{display:flex;gap:8px}
.att-row{display:flex;align-items:center;gap:8px;height:48px;border-bottom:1px solid var(--br-divider)}
.att-row__who{width:96px;white-space:nowrap;display:flex;align-items:center;gap:6px;font:500 var(--text-xs)/14px "Roboto",sans-serif;color:var(--br-neutral-darkest)}
.att-row__track{position:relative;flex:1;height:36px}
.att-row__track .br-m-event-block{position:absolute;top:0;height:36px;padding:3px 6px}
.att-hours{display:flex;margin-left:94px;justify-content:space-between;font:400 11px/13px "Roboto",sans-serif;color:var(--br-text-label)}
.att-absent{color:var(--br-event-leave)}
.att-working{color:var(--br-event-overtime)}
</style>
</head>
<body class="br">
<div class="br-m-screen">
  <header class="br-m-app-bar">
    <div class="br-m-app-bar__row">
      <button class="br-m-app-bar__btn" aria-label="Menu"><span class="mi">menu</span></button>
      <span class="br-m-app-bar__logo">
        <img class="br-logo-light" src="../assets/br-logo-isotype-light.svg" width="32" height="34" alt="Blue Roster">
        <img class="br-logo-dark" src="../assets/br-logo-isotype-dark.svg" width="32" height="34" alt="Blue Roster">
      </span>
      <div class="br-m-app-bar__trailing">
        <button class="br-m-app-bar__btn" aria-label="Notifications"><span class="mi">notifications</span><span class="br-m-badge">2</span></button>
        <button class="br-m-app-bar__btn" aria-label="Account"><span class="br-m-avatar">JM</span></button>
      </div>
    </div>
  </header>

  <main class="br-m-body">
    <section class="br-m-page-header">
      <h1 class="br-m-page-header__title">Attendance</h1>
      <nav class="br-m-tabs">
        <button class="br-page-tab is-active"><span class="mi">view_day</span>Today</button>
        <button class="br-page-tab"><span class="mi">view_week</span>Week</button>
      </nav>
    </section>
    <div class="att-note"><span class="mi" style="font-size:14px;vertical-align:-3px">info</span> Composed pattern — pending design approval</div>
    <div class="br-m-date-nav">
      <span class="br-m-date-nav__label">Thu 8 Oct 2026</span>
      <button class="br-m-date-nav__arrow" aria-label="Previous day"><span class="mi">chevron_left</span></button>
      <button class="br-m-date-nav__today">Today</button>
      <button class="br-m-date-nav__arrow" aria-label="Next day"><span class="mi">chevron_right</span></button>
    </div>
    <div class="att-summary">
      <span class="br-m-status-pill att-working"><span class="mi">check_circle</span><b id="nWork"></b>&nbsp;Working</span>
      <span class="br-m-status-pill att-absent"><span class="mi">cancel</span><b id="nAbs"></b>&nbsp;Absent</span>
    </div>
    <div class="br-m-legend">
      <span class="br-m-legend__item"><i class="br-dot br-dot--shift"></i>Shift</span>
      <span class="br-m-legend__item"><i class="br-dot br-dot--task"></i>Working now</span>
      <span class="br-m-legend__item"><i class="br-dot br-dot--overtime"></i>Overtime</span>
      <span class="br-m-legend__item"><i class="br-dot br-dot--leave"></i>Absent</span>
    </div>
    <div class="att-hours"><span>5 AM</span><span>8 AM</span><span>11 AM</span><span>2 PM</span><span>4 PM</span></div>
    <div id="rows"></div>
  </main>
</div>
<script>
// ASSUMPTIONS (pending approval): one row per employee on a 5 AM–4 PM track; "Working" = task color (in progress),
// scheduled-not-started = shift neutral, absent = leave red full shift, overtime = overtime green. Placeholder names.
const FIRST = 5, LAST = 16;
const rows = [
  { who: 'Employee 1', type: 'task',  title: 'Working', start: 6, end: 16, time: '6:00 am - 4:00 pm' },
  { who: 'Employee 2', type: 'leave', title: 'Absent',  start: 6, end: 16, time: '6:00 am - 4:00 pm' },
  { who: 'Employee 3', type: 'task',  title: 'Working', start: 6, end: 14, time: '6:00 am - 2:00 pm' },
  { who: 'Employee 4', type: 'shift', title: 'Scheduled', start: 12, end: 16, time: '12:00 pm - 4:00 pm' },
  { who: 'Employee 5', type: 'leave', title: 'Absent',  start: 6, end: 16, time: '6:00 am - 4:00 pm' },
  { who: 'Employee 6', type: 'overtime', title: 'Overtime', start: 5, end: 9, time: '5:00 am - 9:00 am' },
];
const el = document.getElementById('rows');
rows.forEach((r, i) => {
  const pct = h => ((h - FIRST) / (LAST - FIRST) * 100) + '%';
  const d = document.createElement('div'); d.className = 'att-row';
  d.innerHTML = `<span class="att-row__who"><span class="br-m-avatar">E${i+1}</span>${r.who}</span>
    <div class="att-row__track"><div class="br-m-event-block br-m-event-block--${r.type}" style="left:${pct(r.start)};width:calc(${pct(r.end)} - ${pct(r.start)})">
    <span class="br-m-event-block__title">${r.title}</span><span class="br-m-event-block__time">${r.time}</span></div></div>`;
  el.appendChild(d);
});
document.getElementById('nWork').textContent = rows.filter(r => r.type === 'task' || r.type === 'overtime').length;
document.getElementById('nAbs').textContent = rows.filter(r => r.type === 'leave').length;
</script>
</body>
</html>
