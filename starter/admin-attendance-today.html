<!doctype html>
<!-- Blue Roster · Admin · Attendance Today (desktop 1440). APPROVED PATTERN.
     Figma: Screens 497:14593 (Light) / 497:14900 (Dark); content br-content-attendance-today 497:4887.
     Sample data: fixtures/admin.json → attendance (Employee 1..6, placeholders). Add ?theme=dark for Dark. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Attendance Today — Blue Roster</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
<link rel="stylesheet" href="br-m.css">
<script>if (/theme=dark/.test(location.search)) document.documentElement.setAttribute('data-theme','dark');</script>
<style>
html,body{margin:0;background:var(--br-neutral-lightest);font-family:"Roboto",sans-serif}
/* br-app-shell App=Admin (simplified: sidebar 232 + page header). Use the real br-app-shell in code. */
.shell{display:flex;width:1440px;height:900px}
.side{width:232px;background:var(--br-contrast);border-right:1px solid var(--br-component-border);padding:16px 12px;box-sizing:border-box}
.side a{display:flex;gap:12px;align-items:center;height:40px;padding:0 12px;border-radius:8px;color:var(--br-neutral-darkest);font:400 14px/20px Roboto;text-decoration:none}
.side a.is-active{background:var(--br-neutral-light)}
.main{flex:1;padding:24px 32px;box-sizing:border-box}
.main h1{font:700 24px/28px Roboto;color:var(--br-neutral-darkest);margin:0 0 24px}
.content{width:1144px;background:var(--br-contrast);padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px}
.summary{display:flex;align-items:center;gap:8px}.summary b{font:500 16px/20px Roboto;color:var(--br-neutral-darkest);margin-right:16px}
.tbl{border:1px solid var(--br-component-border);border-radius:8px;overflow:hidden}
.tr{display:flex;align-items:center;height:52px;border-bottom:1px solid var(--br-divider)}.tr:last-child{border-bottom:0}
.th{height:48px;background:var(--br-neutral-lightest);border-bottom:1px solid var(--br-neutral-light);font:500 12px/14px Roboto;color:var(--br-neutral-dark)}
.c{padding:0 12px 0 16px;box-sizing:border-box;font:400 12px/14px Roboto;color:var(--br-neutral-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c.pri{color:var(--br-neutral-darkest)}
.w1{width:120px}.w2{width:90px}.w3{width:160px}.w4{width:140px}.w5{width:120px;overflow:visible}
.track{position:relative;width:448px;height:36px;margin-left:16px}
.hours{display:flex;margin-left:16px}.hours span{width:64px}
.track .br-m-event-block{position:absolute;top:0;height:36px;box-sizing:border-box;padding:4px 8px}
</style>
</head>
<body class="br">
<div class="shell">
  <nav class="side">
    <a class="is-active"><span class="mi">space_dashboard</span>Action Center</a>
    <a><span class="mi">calendar_month</span>Gantt</a><a><span class="mi">manage_accounts</span>Workload</a>
    <a><span class="mi">folder_special</span>Roster Catalogs</a><a><span class="mi">edit_calendar</span>Rosters</a>
    <a><span class="mi">topic</span>Catalogs</a><a><span class="mi">history</span>History</a><a><span class="mi">assignment_ind</span>Roles</a>
  </nav>
  <main class="main">
    <h1>Attendance Today</h1>
    <section class="content">
      <div class="summary" id="summary"><b>Thu 8 Oct 2026</b></div>
      <div class="br-m-legend">
        <span class="br-m-legend__item"><i class="br-dot br-dot--shift"></i>Shift</span>
        <span class="br-m-legend__item"><i class="br-dot br-dot--task"></i>Tasks</span>
        <span class="br-m-legend__item"><i class="br-dot br-dot--overtime"></i>Overtime</span>
        <span class="br-m-legend__item"><i class="br-dot br-dot--planned"></i>Planned overtime</span>
        <span class="br-m-legend__item"><i class="br-dot br-dot--leave"></i>Leave</span>
      </div>
      <div class="tbl" id="tbl">
        <div class="tr th"><span class="c w1">EMPLOYEE</span><span class="c w2">POSITION</span><span class="c w3">SHIFT</span><span class="c w4">TIME</span><span class="c w5">STATUS</span><span class="hours" id="hours"></span></div>
      </div>
    </section>
  </main>
</div>
<script>
// SAMPLE DATA (fixtures/admin.json → attendance.rows)
const S = '0600 10-Hr w/ Lunch - 60S', T = '6:00 am - 4:00 pm';
const rows = [
  ['Employee 1','Weld','Working',[['task','Shipping/Outside',6,16,T]]],
  ['Employee 2','Package','Working',[['shift',S,6,16,T]]],
  ['Employee 3','Weld','Late',[['shift',S,6,16,T]]],
  ['Employee 4','Package','Absent',[['leave','Vacation',6,16,T]]],
  ['Employee 5','Weld','Working',[['shift',S,6,16,T],['overtime','Weld · Sku 1 hola',17,19,'5:00 pm - 7:00 pm']]],
  ['Employee 6','Package','Absent',[['planned','Weld · Sku 1 hola',5,6,'5:00 am - 6:00 am']]],
];
const PILL = { Working:['approved','check_circle'], Late:['pending','schedule'], Absent:['rejected','cancel'] };
const pill = (s, label) => `<span class="br-m-status-pill br-m-status-pill--${PILL[s][0]}"><span class="mi">${PILL[s][1]}</span>${label || s}</span>`;
const HOUR = 32, FIRST = 5;
const count = s => rows.filter(r => r[2] === s).length;
document.getElementById('summary').insertAdjacentHTML('beforeend', ['Working','Late','Absent'].map(s => pill(s, s + ' ' + count(s))).join(''));
for (let h = FIRST; h < 19; h += 2) document.getElementById('hours').insertAdjacentHTML('beforeend', `<span>${(h % 12 || 12) + (h < 12 ? ' AM' : ' PM')}</span>`);
const tbl = document.getElementById('tbl');
rows.forEach(([e, p, s, evs]) => {
  const blocks = evs.map(([ty, ti, a, b, tm]) => {
    const w = (b - a) * HOUR - 4, compact = w < 120 || b - a <= 1; // overflow rule
    return `<div class="br-m-event-block br-m-event-block--${ty}${compact ? ' is-compact' : ''}" style="left:${(a - FIRST) * HOUR + 2}px;width:${w}px"><span class="br-m-event-block__title">${ti}</span><span class="br-m-event-block__time">${tm}</span></div>`;
  }).join('');
  tbl.insertAdjacentHTML('beforeend', `<div class="tr"><span class="c w1 pri">${e}</span><span class="c w2">${p}</span><span class="c w3">${S}</span><span class="c w4">${T}</span><span class="c w5">${pill(s)}</span><div class="track">${blocks}</div></div>`);
});
</script>
</body>
</html>
